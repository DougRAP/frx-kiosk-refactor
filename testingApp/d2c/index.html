<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Furniture-Rx QA — D2C Storefront</title>
<style>
  :root{
    --paper:#faf7f2; --card:#ffffff; --ink:#1c2430; --ink-soft:#5b6572; --line:#e6e0d6;
    --navy:#14263c; --orange:#e8622c; --gold:#c99a3c; --green:#2e7d4f; --red:#b3372e; --gray:#8a94a0; --blue:#274a72;
    --rim:4px solid var(--orange);
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    --mono:ui-monospace,Consolas,"Cascadia Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5}
  button{font:inherit;cursor:pointer}
  input,textarea,select{font:inherit;color:var(--ink)}
  a{color:var(--orange)}
  code{font-family:var(--mono);font-size:.88em;background:#f1ede4;padding:1px 5px;border-radius:4px}

  #app{display:flex;flex-direction:column;height:100%}
  header{background:var(--navy);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
  header h1{font-size:16px;font-weight:700;letter-spacing:.2px;margin-right:auto}
  header h1 small{display:block;font-size:11px;font-weight:400;opacity:.75}
  .hgroup{display:flex;align-items:center;gap:6px;font-size:12.5px}
  .hgroup label{opacity:.8}
  header select,header input[type=text]{background:#0e1c2e;border:1px solid #33465d;color:#fff;border-radius:6px;padding:4px 8px;font-size:12.5px}
  header input[type=text]{width:230px}
  .hbtn{background:#0e1c2e;border:1px solid #33465d;color:#fff;border-radius:6px;padding:5px 11px;font-size:12.5px}
  .hbtn:hover{border-color:var(--orange)}
  .hbtn.accent{background:var(--orange);border-color:var(--orange);font-weight:600}
  .hbtn.on{background:var(--gold);border-color:var(--gold);color:#231c08}

  #progressbar{height:5px;background:#dcd5c8}
  #progressbar>div{height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--gold));transition:width .3s}

  #main{flex:1;display:flex;min-height:0}
  nav{width:320px;min-width:250px;border-right:1px solid var(--line);overflow-y:auto;background:#f4f0e8;padding-bottom:40px}
  #content{flex:1;overflow-y:auto;padding:22px 26px 90px}

  .navsec{border-bottom:1px solid var(--line)}
  .navsec>button{width:100%;text-align:left;background:none;border:none;padding:10px 12px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px;color:var(--ink)}
  .navsec>button .cnt{margin-left:auto;font-weight:400;font-size:11px;color:var(--ink-soft)}
  .navsec>button .chev{transition:transform .15s;font-size:10px;color:var(--ink-soft)}
  .navsec.open>button .chev{transform:rotate(90deg)}
  .navcases{display:none}
  .navsec.open .navcases{display:block}
  .navcase{width:100%;text-align:left;background:none;border:none;border-left:3px solid transparent;padding:5px 10px 5px 14px;font-size:12.3px;display:flex;gap:7px;align-items:baseline;color:var(--ink)}
  .navcase:hover{background:#ece6da}
  .navcase.current{background:#fff;border-left-color:var(--orange);font-weight:600}
  .navcase .cid{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);white-space:nowrap}
  .navcase .mk{font-size:10px;margin-left:auto}
  .dot{width:9px;height:9px;border-radius:50%;background:#cfc8ba;flex:none;position:relative;top:1px}
  .dot.pass{background:var(--green)} .dot.fail{background:var(--red)} .dot.na{background:var(--gray)}

  .crumb{font-size:12px;color:var(--ink-soft);margin-bottom:8px}
  .card{background:var(--card);border:1px solid var(--line);border-left:var(--rim);border-radius:10px;padding:20px 24px;max-width:900px;box-shadow:0 1px 3px rgba(20,38,60,.06)}
  .case-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
  .case-id{font-family:var(--mono);font-size:12px;color:var(--ink-soft)}
  .tag{font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border-radius:20px;padding:2px 9px}
  .tag.happy{background:#e3efe7;color:#22603d} .tag.validation{background:#eee7f5;color:#5b3d84}
  .tag.access{background:#e5ecf5;color:#274a72} .tag.edge{background:#fbe9e0;color:#9c3d12}
  .tag.role{background:#f1ede4;color:#6b6252;text-transform:none;letter-spacing:0}
  .tag.tech{background:#e7edf2;color:#2b4a63}
  .card h2{font-size:19px;margin:2px 0 12px;line-height:1.3}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-soft);margin:16px 0 6px}
  ol.steps{margin:0 0 4px 22px}
  ol.steps li{margin-bottom:6px}
  .expected{background:#f6f3ec;border:1px solid var(--line);border-radius:8px;padding:10px 14px}
  .why{font-size:12.5px;color:var(--ink-soft);margin-top:8px;font-style:italic}
  .source{font-size:11.5px;color:var(--ink-soft);margin-top:12px;background:#f4f0e8;border:1px dashed var(--line);border-radius:6px;padding:6px 10px}
  .source b{font-weight:600}

  .tech-banner{background:#eef3f7;border:1px solid #cfdce6;border-radius:8px;padding:10px 14px;margin:10px 0}
  .tech-banner p{font-size:13px;margin-bottom:8px}
  .tech-banner .row{display:flex;gap:8px;flex-wrap:wrap}
  .backup-reminder{background:#fff6ec;border:1px solid #f2ceac;border-left:var(--rim);border-radius:8px;padding:10px 14px;margin:0 0 14px;max-width:900px}
  .backup-reminder .bm-txt{font-size:13px;font-weight:600;color:#8a4a1e}
  .backup-reminder .bm-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .backup-reminder .bm-off{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;cursor:pointer}
  .minibtn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 12px;font-size:12.5px;font-weight:600}
  .minibtn:hover{border-color:var(--orange)}

  .datablock{background:#fbfaf6;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:14px}
  .datablock .lbl{margin-top:0}
  .chiprow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
  .chip{display:inline-flex;gap:8px;align-items:center;background:#f1ede4;border:1px solid var(--line);border-radius:20px;padding:4px 6px 4px 12px;font-family:var(--mono);font-size:12.5px}
  .chip .clab{font-family:var(--sans);font-size:11px;color:var(--ink-soft);font-weight:600;margin-right:2px}
  .chip button{border:none;background:#e3ddd0;border-radius:14px;width:24px;height:24px;font-size:12px;line-height:1}
  .chip button:hover{background:var(--orange);color:#fff}
  .datahint{font-size:12px;color:var(--ink-soft);margin-top:6px}
  .datahint b{color:var(--ink)}

  .openwin{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;margin-bottom:12px}
  .openwin:hover{background:var(--orange)}

  .verdict{display:flex;gap:10px;margin:18px 0 12px;flex-wrap:wrap}
  .vbtn{border:2px solid var(--line);background:#fff;border-radius:8px;padding:9px 26px;font-weight:700;font-size:14px;color:var(--ink-soft)}
  .vbtn:hover{border-color:var(--ink-soft)}
  .vbtn.pass.on{background:var(--green);border-color:var(--green);color:#fff}
  .vbtn.fail.on{background:var(--red);border-color:var(--red);color:#fff}
  .vbtn.na.on{background:var(--gray);border-color:var(--gray);color:#fff}
  textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-height:64px;resize:vertical;background:#fff}
  textarea:focus{outline:2px solid var(--orange);outline-offset:-1px;border-color:var(--orange)}

  .shots{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .shot{position:relative;width:96px;height:96px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#f1ede4}
  .shot img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
  .shot button{position:absolute;top:2px;right:2px;background:rgba(20,38,60,.8);color:#fff;border:none;border-radius:12px;width:20px;height:20px;font-size:11px;line-height:1}
  .attachrow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .attachrow .hint{font-size:11.5px;color:var(--ink-soft)}

  .reso{border:1px solid #cfe0cf;background:#eef6ef;border-radius:8px;padding:10px 14px;margin:12px 0}
  .reso.wontfix{border-color:#e6d3ce;background:#f8efec}
  .reso.needinfo{border-color:#e6ddc4;background:#fbf6e7}
  .reso b{font-weight:700}
  .reso .rpill{font-size:10.5px;font-weight:700;text-transform:uppercase;border-radius:20px;padding:2px 9px;margin-right:6px}
  .rpill.fixed{background:#dcefe0;color:#1f5b39}.rpill.wontfix{background:#f2d9d1;color:#8a3b25}.rpill.needinfo{background:#f0e6c6;color:#7a5c10}

  .wiznav{display:flex;gap:10px;margin-top:18px;max-width:900px}
  .wiznav button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 18px;font-weight:600}
  .wiznav button:hover{border-color:var(--orange)}
  .wiznav .next{margin-left:auto;background:var(--navy);color:#fff;border-color:var(--navy)}
  .wiznav .next:hover{background:var(--orange);border-color:var(--orange)}
  .savehint{font-size:11.5px;color:var(--ink-soft);align-self:center}

  .obsbox{max-width:900px;margin-top:22px;background:#fffdf7;border:1px dashed var(--gold);border-radius:10px;padding:14px 18px}
  .obsbox .lbl{margin-top:0;color:#8a6d28}
  .obslog{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .obsentry{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .obsentry .ots{font-size:11px;color:var(--ink-soft);margin-bottom:3px;display:flex;justify-content:space-between}
  .obsentry .odel{border:none;background:none;color:var(--red);font-size:11px;cursor:pointer}
  .obsentry .otext{width:100%;border:1px solid transparent;border-radius:5px;padding:3px 5px;background:#fbfaf6}
  .obsentry .otext:focus{outline:none;border-color:var(--orange);background:#fff}

  .sum-tiles{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0 22px}
  .tile{background:var(--card);border:1px solid var(--line);border-left:var(--rim);border-radius:10px;padding:12px 20px;min-width:110px}
  .tile b{display:block;font-size:24px}.tile span{font-size:12px;color:var(--ink-soft)}
  table.sum{border-collapse:collapse;width:100%;max-width:1040px;background:#fff;font-size:13px}
  table.sum th,table.sum td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
  table.sum th{background:#f1ede4;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px}
  td.st-pass{color:var(--green);font-weight:700} td.st-fail{color:var(--red);font-weight:700}
  td.st-na{color:var(--gray);font-weight:700} td.st-pending{color:var(--ink-soft)}

  .intro p{margin-bottom:10px;max-width:780px}
  .intro ul{margin:0 0 10px 22px;max-width:780px}
  .intro li{margin-bottom:5px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 22px;max-width:820px;margin-top:16px}
  .panel.accent{border-left:var(--rim)}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:4px}
  .field input[type=text],.field input[type=email]{width:100%;max-width:420px;border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:#fff}
  .radio{display:inline-flex;gap:6px;align-items:center;margin-right:16px;font-size:14px}
  .credtable{border-collapse:collapse;width:100%;margin-top:8px;font-size:13px}
  .credtable th,.credtable td{border:1px solid var(--line);padding:6px 8px;text-align:left}
  .credtable th{background:#f1ede4;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  .linkrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

  .modal-bg{position:fixed;inset:0;background:rgba(20,38,60,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:12px;max-width:640px;width:100%;max-height:86vh;overflow-y:auto;padding:22px 26px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal h3{font-size:18px;margin-bottom:10px}
  .modal .x{float:right;border:none;background:none;font-size:20px;cursor:pointer;color:var(--ink-soft)}
  .imgmodal img{max-width:100%;border-radius:8px}

  #toast{position:fixed;bottom:18px;right:18px;background:var(--navy);color:#fff;border-radius:8px;padding:10px 16px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
  #toast.show{opacity:.96}

  @media(max-width:900px){
    #main{flex-direction:column}
    nav{width:100%;max-height:38vh;border-right:none;border-bottom:1px solid var(--line)}
    header input[type=text]{width:150px}
  }
  @media print{ header,nav,.wiznav,#progressbar{display:none} #content{overflow:visible} }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="apptitle"></h1>
    <div class="hgroup"><label for="envsel">Environment</label>
      <select id="envsel"></select>
      <input type="text" id="envbase" spellcheck="false" title="Base URL used in the steps">
    </div>
    <div class="hgroup">
      <button class="hbtn" id="btn-creds">Access &amp; creds</button>
      <button class="hbtn" id="btn-profile">Profile</button>
      <button class="hbtn" id="btn-evidence" title="Show developer evidence on cases">Evidence</button>
      <button class="hbtn" id="btn-summary">Summary</button>
      <button class="hbtn" id="btn-import">Import</button>
      <button class="hbtn" id="btn-merge" title="Merge developer resolutions">Merge fixes</button>
      <button class="hbtn accent" id="btn-export">Export</button>
      <input type="file" id="importfile" accept=".json,application/json" hidden>
      <input type="file" id="mergefile" accept=".json,application/json" hidden>
    </div>
  </header>
  <div id="progressbar"><div></div></div>
  <div id="main">
    <nav id="nav"></nav>
    <div id="content"></div>
  </div>
</div>

<script id="appdata" type="application/json">{"appId":"furnfx-qa-d2c","title":"Furniture-Rx QA — D2C Storefront","version":"2026-07-29","envs":[{"id":"live","label":"Live","base":"https://www.furniturerx.net"},{"id":"local","label":"Localhost (netlify dev)","base":"http://localhost:8888"}],"intro":["This is the public store at furniturerx.net: protection plans (Stain $9.99/mo, Stain + Structure $19.99/mo), the Repair Safety Net membership, care kits, gift coupons, and the Maya chat assistant.","Before paying anything, check with the team that the site is in Stripe TEST mode. Test card: `4242 4242 4242 4242`, any future expiry date, any 3-digit code, any ZIP.","When a case shows a \"Test data for this case\" box, tap the email chip to copy the fresh address it made for you. Each purchase creates an account for that email, so you want a brand-new one every time — do not invent your own.","Plan purchases need a receipt photo: any clear photo of a paper receipt works, so photograph any printed page.","The purchase date must be within the last 60 days (or up to 90 days ahead for a scheduled delivery).","Between purchase cases, empty the cart (the drawer has an \"Empty cart\" button) so each case starts clean."],"sections":[{"id":"landing","title":"1 · Landing, navigation & static content","cases":[{"id":"D2C-001","kind":"happy","role":"Anonymous","title":"Home page loads with all main sections","steps":["Open {BASE}/ in a fresh private/incognito window (a window that starts with no history or saved logins).","Scroll slowly from the top of the page all the way to the bottom."],"expected":"As you scroll you pass, in this order: the hero banner with the plan builder, the two plan comparison cards, a row of trust badges, a preview of the customer dashboard, the FAQ, the care kits, the Repair Safety Net membership section, and the footer. A round chat button floats in a bottom corner. No images are broken and nothing on the page looks obviously missing.","source":"index.html section order; CLAUDE.md layout"},{"id":"D2C-002","kind":"access","role":"Anonymous","title":"Dashboard nav link is hidden for visitors","steps":["In the same private window (still signed out), look at the menu across the top of the page, then open the menu again on a narrow, phone-width window."],"expected":"There is NO \"Dashboard\" item in the menu (it only appears once you are signed in). The menu shows Protection, Repair Safety Net, Care kits, and FAQ.","source":"index.html:66,89 + account-me check (2506-2534)"},{"id":"D2C-003","kind":"happy","role":"Anonymous","title":"Cart badge counts total units","steps":["On the Stain card, press \"+\" until the count reads 2, then press \"Save to cart\".","Add one care kit and add the Repair Safety Net membership.","Look at the small number badge on the cart button (top-right of the header)."],"expected":"The badge shows 4 (2 plans + 1 kit + 1 membership): it adds up every unit in the cart. When the cart is empty the badge disappears completely.","source":"index.html:2327-2335 (badge = Σ plan counts + Σ kit qty + membership)"},{"id":"D2C-004","kind":"validation","role":"Anonymous","title":"Known dead links: footer and referral section","steps":["Scroll to the \"refer a friend\" section and click \"Get your referral link\".","In the footer, click each of these in turn: File a claim, Manage coverage, Contact concierge, Terms of service, Privacy policy, Accessibility."],"expected":"KNOWN state to confirm: every one of these does nothing when clicked (they are placeholders that are not wired up yet). The one exception is the \"Log in\" link in the footer, which does work and opens the account sign-in page. Note anything that now behaves differently.","source":"index.html:734, 763-774 (href=\"#\" no-ops); footer Log in :762"},{"id":"D2C-005","kind":"happy","role":"Anonymous","title":"/dashboard and /login shortcuts","steps":["Type {BASE}/dashboard straight into the address bar.","Then type {BASE}/login straight into the address bar."],"expected":"Both send you to the account sign-in page.","source":"netlify.toml:56-67 (301 redirects, DASH-5/AUTH-1)"},{"id":"D2C-006","kind":"happy","role":"Anonymous","title":"Terms page reachable from every T&C link","steps":["Click any \"terms and conditions\" link on the page (in the plan fine print, in the checkout drawer, or in the FAQ)."],"expected":"Each one opens a real Protection Plan terms and conditions page, not a dead link.","source":"index.html:371,465,773,891 → /terms/"}]},{"id":"config","title":"2 · Configurator & plan cards","cases":[{"id":"D2C-020","kind":"happy","role":"Anonymous","title":"Monthly prices and coverage figures","steps":["In the hero plan builder at the top, choose Stain, then Stain + Structure, keeping the term on Monthly.","Scroll down and compare the prices with the two cards in the comparison section."],"expected":"Stain is $9.99/mo and Stain + Structure is $19.99/mo, both covering \"up to $5,000\". The hero and the cards always show the same prices.","source":"index.html:1248-1252 PLANS; CLAUDE.md pricing (server canonical 999/1999 cents)"},{"id":"D2C-021","kind":"happy","role":"Anonymous","title":"Hero and card steppers are the SAME counter","steps":["On the Stain card, press \"+\" until the stepper reads 3.","Scroll up to the hero plan builder and read its count.","In the hero, press \"+\" once, then scroll back down to the Stain card."],"expected":"After the card edit the hero reads 3 and has switched itself to Stain. After the hero edit the card reads 4. They are one shared cart line and stay in sync.","source":"index.html:1327-1382 (hero count derived from cart line); reflectToHero 1519-1527"},{"id":"D2C-022","kind":"validation","role":"Anonymous","title":"No artificial cap: stepper goes far past 2","steps":["Press \"+\" on a plan stepper 15 times in a row."],"expected":"The count keeps climbing freely, well past 2. The price multiplies with the count and the coverage note reads \"N plans · $5,000 each\".","why":"There is no small limit on how many plans of one type a customer can buy.","source":"MAX_COUNT=99 (index.html:1253); Doug 18-jun \"buy any number\""},{"id":"D2C-023","kind":"validation","role":"Anonymous","title":"Yearly is a preview, never purchasable","steps":["In the hero, switch the term to 1 year, then to 3 years.","Try to use the \"+\"/\"−\" stepper and try to find a Checkout button while on a yearly term.","Switch back to Monthly."],"expected":"On the yearly terms the prices are shown for comparison ($129.99/$259.99 for 1 year, $249.99/$449.99 for 3 years, with $7,500/$10,000 coverage limits), but the stepper does not work, there is no Checkout button, and a note explains that yearly is not available to buy yet. Nothing yearly is ever added to the cart.","why":"Yearly is preview-only for now; only monthly plans can actually be purchased.","source":"CFG-10 display-only; index.html:1334-1375, 2045-2048; server rejects term_not_supported"},{"id":"D2C-024","kind":"happy","role":"Anonymous","title":"Piece type is a label, not a price factor","steps":["With Stain and Monthly selected, change the \"what are you protecting?\" choice between Furniture, Outdoor, Mattress, Rugs, and the others.","Watch the price and the coverage limit as you change it."],"expected":"The price and the $5,000 limit never change when you switch the type. The type is only a description of what you are covering.","source":"index.html:1255-1256; Doug 15-jul SKU-not-Type (type is informative, never a gate)"},{"id":"D2C-025","kind":"edge","role":"Anonymous","title":"Type dropdown with keyboard only","steps":["Press Tab until the \"what are you protecting?\" dropdown is highlighted. Open it with Enter, move through the choices with the arrow keys, jump with Home and End, and close it with Escape."],"expected":"The dropdown works fully with the keyboard alone. Escape closes it without changing the choice. If the dropdown is near the bottom of the window, the list opens upward so it is not cut off  Structure plan and look again."],"expected":"On its own the membership is $19.99/mo. With a Stain plan it becomes $9.99/mo, shown as \"50% off with your Stain plan\". With a Stain + Structure plan it shows \"Included\" ($0). The Stripe payment page must later charge these same amounts.","source":"MEM-6 Architecture B (Doug 06-jul); index.html:2389-2424; server _lib/stripe.mjs:65-75"},{"id":"D2C-061","kind":"validation","role":"Anonymous","title":"KNOWN copy mismatch in the membership section","steps":["Read the membership section copy that talks about being \"included with any protection plan\".","Compare it with what the cart actually charged in the previous case (50% off with a Stain plan)."],"expected":"KNOWN ISSUE to confirm: the section says \"$19.99 value — included with any protection plan\", but with a Stain-only plan the cart charges $9.99 (50% off), not $0. Write down the exact wording you see.","source":"Gap: index.html:480 copy vs 2389-2396 behavior"},{"id":"D2C-062","kind":"happy","role":"Anonymous","title":"Membership is max one, no quantity","steps":["Add the membership from its section, then try to add it again from a different \"Add membership\" button."],"expected":"Every \"Add membership\" button changes to a greyed-out \"✓ In cart\". There is never a quantity stepper for the membership.","source":"index.html:1712-1727, 1305-1310"},{"id":"D2C-063","kind":"happy","role":"Anonymous","title":"Kits: three at $49.99, cap 20","steps":["Look at the three care kits (Wood, Fabric & upholstery, Leather) and their prices.","Push one kit's quantity stepper past 20."],"expected":"All three kits are $49.99. The quantity stops at 20.","source":"index.html:624-690, cap :3013/2375"},{"id":"D2C-064","kind":"happy","role":"Anonymous","title":"Membership T&C modal","steps":["Click \"See membership details\".","Skim the text in the pop-up."],"expected":"A full membership terms pop-up opens and closes properly. KNOWN ISSUE to confirm: it still contains fill-in placeho "},{"id":"D2C-083","kind":"validation","role":"Buyer","title":"Purchase date window: 60 days back, 90 forward","steps":["Open the date picker on the delivery/purchase date field.","Try to pick a date about 3 months ago, and one about 4 months ahead.","Then pick a date about 2 weeks ago and continue."],"expected":"The picker only allows dates from 60 days ago through 90 days ahead. Anything outside that cannot be picked (or is rejected if it is forced through). The date about 2 weeks ago is accepted.","source":"ELIG_DAYS=60/HORIZON_DAYS=90 (index.html:1817-1825); server validate.mjs:138-150; Doug 27-jul"},{"id":"D2C-084","kind":"validation","role":"Buyer","title":"Receipt photo: required, images only, 2 MB after compression","steps":["With a plan in the cart, try to submit without a photo.","Try attaching a PDF or a .txt file as the receipt.","Attach a normal photo of a receipt and submit."],"expected":"With no photo the sale is blocked and the receipt is named in the \"Missing\" list. A non-image file is rejected with a clear message. A normal photo uploads (the browser shrinks it first) and the checkout continues.","source":"index.html:876, 1935-1968; upload-receipt.mjs 2MB + image sniffing"},{"id":"D2C-085","kind":"validation","role":"Buyer","title":"Referral code is optional and never blocks","steps":["Type \"XXXX-9999\" in the dealer referral code field and click elsewhere.","Complete the purchase anyway."],"expected":"The unknown code shows \"Code not recognized — you can still check out.\" and the sale completes normally. With a REAL dealer code you instead see \"Code applied — supporting \u003cdealer>.\"","why":"A wrong or switched-off referral code is ignored but must never stop a sale.","source":"index.html:1794-1807; Doug 15-jul: invalid/disabled code never blocks the sale"},{"id":"D2C-086","kind":"edge","role":"Buyer","title":"Rapid-fire checkouts hit a polite rate limit","steps":["Start a checkout and cancel it, and repeat quickly 6 or more times within ike XXXX-XXXX-XXXX, and a line saying you will be asked to choose your own password the first time you sign in.","source":"_lib/onboarding.mjs:31-53; MAIL-1 Doug 08-jul (one link only)"},{"id":"D2C-102","kind":"happy","role":"Customer","title":"First login forces a password change, no skip","steps":["Click the button in the welcome email. Confirm the sign-in form is already filled in with your email.","Sign in using the temporary password.","Look carefully for any way to skip the \"choose a new password\" step."],"expected":"Sign-in succeeds and you are taken straight into \"set a new password\", with no skip option. A password under 8 characters is rejected. After you set one, you reach the dashboard.","source":"account.html:901-935 (no Skip); auth-set-password PW_MIN=8; SEC-3a server-enforced"},{"id":"D2C-103","kind":"access","tech":true,"role":"Customer","title":"Temp password cannot bypass the forced change","steps":["This is a technical check. Do a fresh purchase and sign in with the temporary password, but BEFORE setting the new password, press F12, open the \"Network\" tab, and copy the \"Authorization\" header from any API request.","In the Console, run: fetch(\"/api/get-my-account\",{headers:{Authorization:\"Bearer \u003ctoken>\"}}).then(r=>r.status).then(console.log)"],"expected":"The response is 403 — the forced password change is enforced by the server, not just hidden on the screen.","source":"_lib/auth.mjs:35-45; SEC-3a"},{"id":"D2C-104","kind":"happy","needs":["email"],"role":"Customer","title":"One-time code (OTP) recovery works","steps":["Sign out. On the sign-in page choose \"Email me a one-time code instead\".","Enter the code from the email."],"expected":"A numeric code arrives by email and entering it signs you in. A wrong code shows \"That code didn't work — check it or request a new one.\"","source":"account.html:338-343, 927-941; auth-otp.mjs"},{"id":"D2C-105","kind":"happy","role":"Customer","title":"Real dashboard replaces the marketing mock","steps":["While signed in, open {BASE}/ and scroll to the dashboard section."],"expected":"The preview is replaced by YOUR real coverage: the correct plan, price, status, and start date. An account with only a membership shows a separate \"Your membership\" card instead.","source":"index.html:2916-2952 loadAccount; get-my-account.mjs"},{"id":"D2C-106","kind":"edge","needs":["email"],"role":"Customer","title":"Clicking the email link before the account is ready","steps":["On a NEW purchase, open the dashboard as fast as you can after paying (within seconds)."],"expected":"If the account is still being set up you see \"Setting up your coverage…\" and the page keeps retrying on its own (for about 7 seconds) instead of showing an error. Note how long it took.","source":"index.html:2914-2945 retry/backoff for the webhook race"},{"id":"D2C-107","kind":"access","needs":["email"],"role":"Customer","title":"Signed-in checkout locks the buyer email","steps":["While signed in, build a cart and open the checkout form.","Try to edit the email field. Then press \"Not you? Sign out\"."],"expected":"The email field is locked and shows \"Buying as \u003cyour email>\". Signing out unlocks it and also hides the Dashboard menu item again.","source":"index.html:844-845, 2525-2543"},{"id":"D2C-108","kind":"edge","tech":true,"role":"Customer","title":"Session expiry is handled gracefully","steps":["This is a technical check. While signed in on {BASE}/, open the Console (F12) and run: sessionStorage.setItem(\"furnfx_session\", JSON.stringify({access_token:\"expired-garbage\"})). Reload the page and scroll to the dashboard section."],"expected":"The page notices the bad session and shows \"Your session expired. Please use the link in your email again.\" There is no crash and no endless spinner; the preview returns to its marketing state.","source":"index.html:2921-2924"}]},{"id":"maya","title":"7 · Maya chat assistant","cases":[{"id":"D2C-120","kind":"happy","role":"Anonymous","title":"Maya opens and quotes monthly prices only","steps":["Open the chat (the floating chat button). Ask: \"how much are the plans?\""],"expected":"She quotes ONLY the monthly prices: $9.99 Stain and $19.99 Stain + Structure, with $5,000 coverage. She stays friendly and on-brand.","source":"chat.mjs:42-47 grounded facts"},{"id":"D2C-121","kind":"validation","role":"Anonymous","title":"G13b: Maya refuses to quote yearly prices","steps":["Ask Maya: \"what does the 3-year plan cost?\" and then insist: \"just give me the yearly number\"."],"expected":"She never states a yearly dollar amount; she points you to the plan cards on the page. Insisting does not break her.","source":"Gate G13b; chat.mjs:48"},{"id":"D2C-122","kind":"validation","role":"Anonymous","title":"Maya never interprets coverage or claims","steps":["Ask Maya: \"my dog scratched the couch, is that covered?\" and then \"will my claim be approved?\""],"expected":"She declines to judge coverage or claim outcomes and points you to the plan terms. She never promises approval.","source":"MAYA-1 (Doug 04-jul \"I can't comment on that\"); chat.mjs:70-72"},{"id":"D2C-123","kind":"happy","role":"Anonymous","title":"Big-order quote: 10% of retail, needs your phone","steps":["Tell Maya: \"I bought $30,000 of furniture, what would coverage cost?\"","Follow her flow; when she offers to have an agent call you, give a name and phone number."],"expected":"The estimate is 10% of the retail amount ($3,000/year for this example), labeled as preliminary pending agent verification. Saving the callback requires a phone number.","why":"The estimate is worked out by the system, not made up by the assistant.","source":"chat.mjs QUOTE_RATE=0.10, save_quote_lead requires phone (:123-136)"},{"id":"D2C-124","kind":"happy","needs":["email"],"role":"Anonymous","title":"Maya sizes coverage and pre-fills checkout","steps":["From a plan card, click the \"Maya · your sales assistant\" trigger.","Answer her questions (name, the email from the \"Tes eds":["email"],"role":"Buyer","title":"Buy a gift and receive the code","steps":["Buy the cheapest gift with the test card, using the email from the \"Test data for this case\" box below.","Check that email for the gift code."],"expected":"A one-time charge of $29.97 goes through and a gift code arrives (in the style GIFT-XXXXXXXX). Per the manual it is good for 1 use, expires in 90 days, and is for new customers.","source":"misc/gift-coupons-manual.html; create-gift-checkout.mjs"},{"id":"D2C-142","kind":"happy","needs":["email"],"role":"Gift recipient","title":"Redeem the gift inside Stripe checkout","steps":["As a NEW customer (a fresh email), start a normal monthly plan checkout for the same tier that was gifted.","On the Stripe page, use \"Add promotion code\" and enter the gift code."],"expected":"Stripe accepts the code and takes the discount off the first 3 months. There is deliberately no code box on our own site; the code is entered only on Stripe's page.","source":"_lib/checkout.mjs:158-162 allow_promotion_codes (subscription mode only)"},{"id":"D2C-143","kind":"validation","needs":["email"],"role":"Buyer","title":"Gift limits and errors","steps":["Try the gift form with the email \"nope@\". If you have time, buy or start 6 gifts using the SAME buyer email."],"expected":"The bad email is rejected. The 6th unredeemed gift for one buyer email is refused (the limit is 5). If gifts are not switched on in this environment, you instead see \"Gifts aren't available just yet.\" — note which one you saw.","source":"create-gift-checkout.mjs: invalid_email, gift_limit 409, 503 not configured"}]},{"id":"abuse","title":"9 · Access, security & URL games","cases":[{"id":"D2C-160","kind":"access","role":"Attacker-ish","title":"Secrets and internal files are not served","steps":["Open each of these in the address bar: {BASE}/.env, {BASE}/.env.production, {BASE}/CLAUDE.md, {BASE}/misc/backlog-furniturerx.html."],"expected":"Every one is Not Found (or just shows the normal store page). Only the store, the account page, the terms page, and the kit images are published.","source":"netlify.toml:22-44 SEC-1; scripts/build.mjs publishes an explicit whitelist"},{"id":"D2C-161","kind":"access","tech":true,"role":"Attacker-ish","title":"API rejects strangers","steps":["This is a technical check. Open the Console (F12) on {BASE}/ and run these one at a time:","fetch(\"/api/get-my-account\").then(r=>r.status).then(console.log)","fetch(\"/api/get-my-account\",{headers:{Authorization:\"Bearer nonsense\"}}).then(r=>r.status).then(console.log)"],"expected":"Both return 401. No account data ever comes back without a valid sign-in token.","source":"get-my-account.mjs:37-44"},{"id":"D2C-162","kind":"access","role":"Anonymous","title":"Kiosk UI never leaks into a normal visit","steps":["Open {BASE}/?kiosk=1 and notice the extra in-store fields (associate #, ways-to-pay options).","Now open the plain {BASE}/ in the SAME tab and check whether those extra fields are gone."],"expected":"The in-store fields appear ONLY with ?kiosk=1 and do not stick around: the next plain visit is a normal store with no associate field and no delivery options.","source":"index.html:33-38 (no persistence, clears sticky flag)"},{"id":"D2C-163","kind":"edge","tech":true,"role":"Anonymous","title":"Junk in the URL is harmless","steps":["Open {BASE}/?paid=1 with an empty cart. Then open {BASE}/?ref=\u003cscript>alert(1)\u003c/script>. Then open {BASE}/#access_token=fake123 and immediately look at the address bar."],"expected":"There is no fake purchase, no pop-up ever appears, and the \"#access_token\" part is wiped from the web address right away. Everything keeps working.","source":"index.html:2291-2298; :11-25 hash stripping; textContent-only rendering"},{"id":"D2C-164","kind":"edge","role":"Buyer","title":"Double-click the pay button","steps":["With a valid form ready, double-click the Pay button as fast as you can."],"expected":"Only one checkout starts: one Stripe page and one charge. Note anything else you see.","source":"Submit handler + server rate limit; observe"},{"id":"D2C-165","kind":"edge","role":"Buyer","title":"Back button after payment","steps":["After a successful purchase, press the browser Back button until you are back at the store."],"expected":"The cart stays empty, and re-submitting an old form page cannot charge you again without rebuilding the cart.","source":"clearCart on ?paid=1 (index.html:2291-2298)"},{"id":"D2C-166","kind":"edge","role":"Anonymous","title":"Phone-width walkthrough","steps":["Open developer tools and switch to phone/device mode at 360 px wide. Walk through: the plan builder, a card, the cart drawer, the form, and the chat."],"expected":"There is no sideways scrolling, the drawer is usable, the chat panel fits, and the steppers are easy to tap. Note every visual defect along with the screen width where you saw it.","source":"Responsive expectation (portal has a formal gate; D2C findings go to observations)"},{"id":"D2C-167","kind":"edge","role":"Buyer","title":"Offline mid-checkout","steps":["Fill in a valid form. Open developer tools, go to the Network tab, and set it to \"Offline\". Press Pay. Then restore the network and retry."],"expected":"A readable error appears (not a dead, frozen button). After reconnecting, retrying works with the cart still intact.","source":"Front surfaces checkout errors verbatim (index.html:2117)"}]}]}</script>
<script>
'use strict';
(function(){
  var DATA = JSON.parse(document.getElementById('appdata').textContent);
  var LSKEY = 'furnfx_qa_' + DATA.appId;
  var IMG_MAX_BYTES = 1500000, TOTAL_IMG_WARN = 4000000;
  var BACKUP_EVERY = 3; // remind the tester to export a backup every N advances

  /* ---------------- data generators ---------------- */
  function rngLetters(n){ var a='abcdefghijklmnopqrstuvwxyz',s=''; for(var i=0;i<n;i++) s+=a[Math.floor(Math.random()*26)]; return s; }
  function rngDigits(n){ var s=''; for(var i=0;i<n;i++) s+=Math.floor(Math.random()*10); return s; }
  function genAssociate(name){ var l=(String(name||'').toUpperCase().replace(/[^A-Z]/g,'')+'XXX').slice(0,3); return l+'-'+rngDigits(3); }
  function emailValid(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e||'').trim()); }
  function genEmail(base){ var b=String(base||'').trim(); var at=b.indexOf('@'); if(at<1) return ''; var local=b.slice(0,at).split('+')[0]; return local+'+'+rngLetters(6)+b.slice(at); }
  function emailBase(){ var b=String(state.testerEmail||'').trim(); var at=b.indexOf('@'); return at<1? '' : b.slice(0,at).split('+')[0]+b.slice(at); }

  /* ---------------- state ---------------- */
  function blankState(){
    return { appId:DATA.appId, version:DATA.version, tester:'', testerEmail:'', isTechnical:null,
             showEvidence:false, envId:DATA.envs[0].id, customBase:'',
             results:{}, testdata:{}, observations:'', stepsSinceExport:0, backupReminderOff:false, updatedAt:null };
  }
  var state = blankState();

  function coerceNotes(v, fallbackTs){
    if(Array.isArray(v)) return v.filter(function(e){return e&&typeof e.text==='string';}).map(function(e){return {id:e.id||rid(),ts:e.ts||fallbackTs,text:e.text};});
    if(typeof v==='string' && v.trim()) return [{id:rid(),ts:fallbackTs,text:v}];
    return [];
  }
  function rid(){ return Math.random().toString(36).slice(2,9); }
  function nowISO(){ return new Date().toISOString(); }

  function hydrate(s){
    if(!s || s.appId!==DATA.appId) return;
    if(typeof s.tester==='string') state.tester=s.tester;
    if(typeof s.testerEmail==='string') state.testerEmail=s.testerEmail;
    if(s.isTechnical===true||s.isTechnical===false) state.isTechnical=s.isTechnical;
    if(typeof s.showEvidence==='boolean') state.showEvidence=s.showEvidence;
    if(typeof s.envId==='string') state.envId=s.envId;
    if(typeof s.customBase==='string') state.customBase=s.customBase;
    state.updatedAt=s.updatedAt||null;
    var fb=s.updatedAt||nowISO();
    if(s.results&&typeof s.results==='object') Object.keys(s.results).forEach(function(k){
      var r=s.results[k]; if(!r) return;
      var out={status:(r.status==='pass'||r.status==='fail'||r.status==='na')?r.status:null, note:typeof r.note==='string'?r.note:'', shots:[]};
      if(Array.isArray(r.shots)) out.shots=r.shots.filter(function(x){return x&&typeof x.dataUrl==='string'&&x.dataUrl.indexOf('data:image/')===0;}).map(function(x){return {id:x.id||rid(),ts:x.ts||fb,name:x.name||'shot',dataUrl:x.dataUrl};});
      if(r.resolution&&typeof r.resolution==='object'&&typeof r.resolution.text==='string') out.resolution={status:r.resolution.status||'fixed',text:r.resolution.text,ts:r.resolution.ts||fb};
      if(r.retest===true) out.retest=true;
      state.results[k]=out;
    });
    if(typeof s.observations==='string') state.observations=s.observations;
    if(typeof s.stepsSinceExport==='number' && s.stepsSinceExport>=0) state.stepsSinceExport=s.stepsSinceExport;
    if(typeof s.backupReminderOff==='boolean') state.backupReminderOff=s.backupReminderOff;
    if(s.testdata&&typeof s.testdata==='object') Object.keys(s.testdata).forEach(function(k){ var d=s.testdata[k]; if(d&&typeof d==='object') state.testdata[k]={associate:d.associate||undefined,email:d.email||undefined}; });
    /* migrate legacy per-section notes + product notes into the single Additional observations box (no data loss) */
    var legacy=[];
    if(s.sectionNotes&&typeof s.sectionNotes==='object') Object.keys(s.sectionNotes).forEach(function(k){ coerceNotes(s.sectionNotes[k],fb).forEach(function(e){ legacy.push('['+fmtTs(e.ts)+'] '+e.text); }); });
    if(Array.isArray(s.productNotes)) s.productNotes.forEach(function(p){ if(p&&typeof p.text==='string') legacy.push('['+fmtTs(p.ts||fb)+'] '+(p.caseId?'('+p.caseId+') ':'')+p.text); });
    if(legacy.length) state.observations=(state.observations?state.observations+'\n':'')+legacy.join('\n');
  }
  (function load(){ try{ var raw=localStorage.getItem(LSKEY); if(raw) hydrate(JSON.parse(raw)); }catch(e){} })();

  var saveTimer=null;
  function persist(){
    state.updatedAt=nowISO();
    clearTimeout(saveTimer);
    saveTimer=setTimeout(function(){
      try{ localStorage.setItem(LSKEY, JSON.stringify(state)); }
      catch(e){ toast(e && /quota/i.test(e.name||e.message||'') ? 'Browser storage is full — export your progress to keep it safe.' : 'Could not save: '+e.message); }
    },250);
  }

  /* ---------------- helpers ---------------- */
  var allCases=[]; DATA.sections.forEach(function(sec){ sec.cases.forEach(function(c){ allCases.push({sec:sec,c:c}); }); });
  function res(id){ if(!state.results[id]) state.results[id]={status:null,note:'',shots:[]}; if(!state.results[id].shots) state.results[id].shots=[]; return state.results[id]; }
  function td(id){ if(!state.testdata[id]) state.testdata[id]={}; return state.testdata[id]; }
  function envBase(){ if(state.customBase.trim()) return state.customBase.trim().replace(/\/+$/,''); var e=DATA.envs.find(function(x){return x.id===state.envId;})||DATA.envs[0]; return e.base.replace(/\/+$/,''); }
  function linkFor(label){ if(!DATA.access||!DATA.access.links) return null; var l=DATA.access.links.find(function(x){return x.label===label;}); if(!l) return null; return (l.urlByEnv&&(l.urlByEnv[state.envId]||l.urlByEnv[DATA.envs[0].id]))||l.url||null; }
  function el(t,c,x){ var n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; }
  function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},2600); }
  function openWindow(url){ var w=window.open(url,'_blank','noopener,noreferrer,width=1200,height=900'); if(!w){ toast('Pop-up blocked — allow pop-ups, or the link opens in a new tab.'); window.open(url,'_blank','noopener'); } }
  function fmtTs(iso){ try{ return new Date(iso).toLocaleString(); }catch(e){ return iso; } }

  function copyText(v){
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(v).then(function(){toast('Copied');},function(){fallbackCopy(v);}); }
    else fallbackCopy(v);
  }
  function fallbackCopy(v){ var ta=document.createElement('textarea'); ta.value=v; ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Copied'); }catch(e){ toast('Copy failed — select and copy manually'); } ta.remove(); }
  function copyChip(label,value,onRegen){
    var c=el('span','chip'); if(label){ var l=el('span','clab',label); c.appendChild(l); }
    c.appendChild(document.createTextNode(value));
    var cp=el('button',null,'⧉'); cp.title='Copy'; cp.addEventListener('click',function(){copyText(value);}); c.appendChild(cp);
    if(onRegen){ var rg=el('button',null,'↻'); rg.title='New value'; rg.addEventListener('click',onRegen); c.appendChild(rg); }
    return c;
  }

  function rich(target,text){
    var s=String(text).split('{BASE}').join(envBase());
    var re=/(https?:\/\/[^\s,;)"']+)|`([^`]+)`/g,last=0,m;
    while((m=re.exec(s))){
      if(m.index>last) target.appendChild(document.createTextNode(s.slice(last,m.index)));
      if(m[1]){ var a=el('a',null,m[1]); a.href=m[1]; a.addEventListener('click',function(ev){ev.preventDefault();openWindow(this.href);}); target.appendChild(a); }
      else target.appendChild(el('code',null,m[2]));
      last=re.lastIndex;
    }
    if(last<s.length) target.appendChild(document.createTextNode(s.slice(last)));
  }

  /* ---------------- header ---------------- */
  var h1=document.getElementById('apptitle');
  h1.appendChild(document.createTextNode(DATA.title));
  h1.appendChild(el('small',null,'Suite '+DATA.version+' · '+allCases.length+' cases'));
  document.title=DATA.title;

  var envsel=document.getElementById('envsel'), envbase=document.getElementById('envbase');
  DATA.envs.forEach(function(e){ var o=el('option',null,e.label); o.value=e.id; envsel.appendChild(o); });
  var co=el('option',null,'Custom…'); co.value='__custom__'; envsel.appendChild(co);
  function syncEnvUI(){
    envsel.value=state.customBase.trim()?'__custom__':state.envId;
    envbase.value=state.customBase.trim()||(DATA.envs.find(function(x){return x.id===state.envId;})||DATA.envs[0]).base;
    envbase.readOnly=!state.customBase.trim()&&envsel.value!=='__custom__';
  }
  envsel.addEventListener('change',function(){
    if(envsel.value==='__custom__'){ state.customBase=envbase.value; envbase.readOnly=false; envbase.focus(); }
    else { state.envId=envsel.value; state.customBase=''; }
    persist(); syncEnvUI(); render();
  });
  envbase.addEventListener('input',function(){ if(envsel.value==='__custom__'){ state.customBase=envbase.value; persist(); } });
  envbase.addEventListener('change',render);

  document.getElementById('btn-evidence').addEventListener('click',function(){ state.showEvidence=!state.showEvidence; persist(); render(); });
  document.getElementById('btn-summary').addEventListener('click',function(){ view.mode='summary'; render(); });
  document.getElementById('btn-creds').addEventListener('click',showCredsModal);
  document.getElementById('btn-profile').addEventListener('click',showProfileModal);

  /* ---------------- export / import / merge ---------------- */
  document.getElementById('btn-export').addEventListener('click',function(){
    state.updatedAt=nowISO();
    var name=DATA.appId+'_progress_'+state.updatedAt.slice(0,19).replace(/[:T]/g,'-')+'.json';
    var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
    state.stepsSinceExport=0; persist(); toast('Exported '+name);
    if(view.mode==='case') render();
  });
  document.getElementById('btn-import').addEventListener('click',function(){ document.getElementById('importfile').click(); });
  document.getElementById('importfile').addEventListener('change',function(ev){
    var f=ev.target.files[0]; ev.target.value=''; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){ try{ var s=JSON.parse(rd.result); if(!s||s.appId!==DATA.appId){ toast('That file belongs to a different suite ('+(s&&s.appId||'unknown')+').'); return; } if(!confirm('Import REPLACES the progress stored in this browser. Continue?')) return; localStorage.setItem(LSKEY,JSON.stringify(s)); location.reload(); }catch(e){ toast('Invalid file: '+e.message); } };
    rd.readAsText(f);
  });
  document.getElementById('btn-merge').addEventListener('click',function(){ document.getElementById('mergefile').click(); });
  document.getElementById('mergefile').addEventListener('change',function(ev){
    var f=ev.target.files[0]; ev.target.value=''; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var s=JSON.parse(rd.result); if(!s||s.appId!==DATA.appId){ toast('That file belongs to a different suite.'); return; }
        var n=0;
        if(s.results&&typeof s.results==='object') Object.keys(s.results).forEach(function(k){
          var inc=s.results[k]; if(!inc||!inc.resolution||typeof inc.resolution.text!=='string') return;
          var r=res(k); r.resolution={status:inc.resolution.status||'fixed',text:inc.resolution.text,ts:inc.resolution.ts||nowISO()};
          if(r.status==='fail'||r.status==='na') r.retest=true;
          n++;
        });
        persist(); toast('Merged '+n+' resolution(s). See the "Needs retest" filter.'); render();
      }catch(e){ toast('Invalid file: '+e.message); }
    };
    rd.readAsText(f);
  });

  /* ---------------- modals ---------------- */
  var modalBg=document.getElementById('modal-bg'), modal=document.getElementById('modal');
  modalBg.addEventListener('click',function(e){ if(e.target===modalBg) closeModal(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeModal(); });
  function closeModal(){ modalBg.classList.remove('show'); modal.textContent=''; }
  function openModal(build){ modal.textContent=''; var x=el('button','x','×'); x.addEventListener('click',closeModal); modal.appendChild(x); build(modal); modalBg.classList.add('show'); }

  function credsContent(host){
    host.appendChild(el('h3',null,'Access & credentials'));
    if(!DATA.access){ host.appendChild(el('p',null,'This suite needs no special logins.')); return; }
    if(DATA.access.note){ var p=el('p'); p.style.cssText='color:var(--ink-soft);margin-bottom:10px'; rich(p,DATA.access.note); host.appendChild(p); }
    if(DATA.access.credentials&&DATA.access.credentials.length){
      var t=el('table','credtable'); var hr=el('tr'); ['Role','Email','Password',''].forEach(function(h){hr.appendChild(el('th',null,h));}); t.appendChild(hr);
      DATA.access.credentials.forEach(function(c){
        var tr=el('tr');
        tr.appendChild(el('td',null,c.role));
        var te=el('td'); te.appendChild(el('code',null,c.email)); tr.appendChild(te);
        var tp=el('td'); tp.appendChild(el('code',null,c.password)); tr.appendChild(tp);
        var ta=el('td'); var b=el('button','minibtn','Copy login'); b.addEventListener('click',function(){copyText(c.email+' / '+c.password);}); ta.appendChild(b); tr.appendChild(ta);
        t.appendChild(tr);
      });
      host.appendChild(t);
    }
    if(DATA.access.links&&DATA.access.links.length){
      var lr=el('div','linkrow');
      DATA.access.links.forEach(function(l){ var url=linkFor(l.label); if(!url) return; var b=el('button','minibtn','Open '+l.label+' ↗'); b.addEventListener('click',function(){openWindow(url);}); lr.appendChild(b); });
      host.appendChild(lr);
    }
    var sec=el('p'); sec.style.cssText='font-size:12px;color:var(--ink-soft);margin-top:12px'; sec.textContent='These are shared QA accounts on the test environment. Do not use real customer data.'; host.appendChild(sec);
  }
  function showCredsModal(){ openModal(credsContent); }

  function profileContent(host){
    host.appendChild(el('h3',null,'Tester profile'));
    var f1=el('div','field'); f1.appendChild(el('label',null,'Your name')); var i1=el('input'); i1.type='text'; i1.value=state.tester; i1.addEventListener('input',function(){state.tester=i1.value;persist();}); f1.appendChild(i1); host.appendChild(f1);
    var f2=el('div','field'); f2.appendChild(el('label',null,'Email to return results to (your real inbox)')); var i2=el('input'); i2.type='email'; i2.value=state.testerEmail; i2.placeholder='e.g. abarres@raptns.com'; i2.addEventListener('input',function(){state.testerEmail=i2.value;persist();}); f2.appendChild(i2); host.appendChild(f2);
    var f3=el('div','field'); f3.appendChild(el('label',null,'Are you comfortable using browser developer tools?'));
    [['Yes',true],['No',false]].forEach(function(pair){
      var lab=el('label','radio'); var r=el('input'); r.type='radio'; r.name='tech'; r.checked=state.isTechnical===pair[1];
      r.addEventListener('change',function(){ state.isTechnical=pair[1]; persist(); render(); });
      lab.appendChild(r); lab.appendChild(document.createTextNode(pair[0])); f3.appendChild(lab);
    });
    host.appendChild(f3);
  }
  function showProfileModal(){ openModal(profileContent); }

  /* ---------------- image compress ---------------- */
  function compressImage(file, cb){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var mx=1400, w=img.width, h=img.height, sc=Math.min(1, mx/Math.max(w,h));
      var cv=document.createElement('canvas'); cv.width=Math.round(w*sc); cv.height=Math.round(h*sc);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      try{ cb(cv.toDataURL('image/jpeg',0.7)); }catch(e){ cb(null); }
    };
    img.onerror=function(){ URL.revokeObjectURL(url); cb(null); };
    img.src=url;
  }
  function totalImgBytes(){ var t=0; Object.keys(state.results).forEach(function(k){ (state.results[k].shots||[]).forEach(function(s){ t+=s.dataUrl.length; }); }); return t; }
  function addShot(id,file){
    if(!file||file.type.indexOf('image/')!==0){ toast('Only images can be attached.'); return; }
    compressImage(file,function(dataUrl){
      if(!dataUrl){ toast('Could not read that image.'); return; }
      if(dataUrl.length>IMG_MAX_BYTES){ toast('That image is too large even after compression — crop it and retry.'); return; }
      res(id).shots.push({id:rid(),ts:nowISO(),name:file.name||'screenshot',dataUrl:dataUrl});
      if(totalImgBytes()>TOTAL_IMG_WARN) toast('Storage is filling up — export your progress to keep screenshots safe.');
      persist(); render();
    });
  }

  /* ---------------- progress ---------------- */
  function counts(){ var p=0,f=0,n=0,rt=0; allCases.forEach(function(x){ var r=state.results[x.c.id]; if(r&&r.retest&&(r.status==='fail'||r.status==='na')) rt++; if(!r||!r.status) return; if(r.status==='pass')p++; else if(r.status==='fail')f++; else n++; }); return {pass:p,fail:f,na:n,retest:rt,done:p+f+n,total:allCases.length}; }
  function updateProgress(){ var c=counts(); document.querySelector('#progressbar>div').style.width=(c.total?100*c.done/c.total:0)+'%'; document.getElementById('btn-evidence').classList.toggle('on',state.showEvidence); }

  /* ---------------- navigation ---------------- */
  var view={mode:'intro',idx:0,retestOnly:false};
  var nav=document.getElementById('nav');
  function isTech(c){ return !!c.tech; }
  function buildNav(){
    nav.textContent='';
    var ib=el('button','navcase'+(view.mode==='intro'?' current':'')); ib.style.cssText='padding:10px 12px;font-weight:700'; ib.appendChild(el('span','cid','▸')); ib.appendChild(el('span',null,'Before you start'));
    ib.addEventListener('click',function(){ view.mode='intro'; render(); });
    nav.appendChild(ib);
    DATA.sections.forEach(function(sec){
      var visCases=sec.cases.filter(function(c){ return !view.retestOnly || (function(){var r=state.results[c.id];return r&&r.retest&&(r.status==='fail'||r.status==='na');})(); });
      if(!visCases.length) return;
      var wrap=el('div','navsec');
      var head=el('button'); head.appendChild(el('span','chev','▶')); head.appendChild(el('span',null,sec.title));
      var done=sec.cases.filter(function(c){var r=state.results[c.id];return r&&r.status;}).length;
      head.appendChild(el('span','cnt',done+'/'+sec.cases.length));
      head.addEventListener('click',function(){ wrap.classList.toggle('open'); });
      wrap.appendChild(head);
      var list=el('div','navcases');
      visCases.forEach(function(c){
        var gi=allCases.findIndex(function(x){return x.c.id===c.id;});
        var b=el('button','navcase'+(view.mode==='case'&&view.idx===gi?' current':''));
        var r=state.results[c.id];
        b.appendChild(el('span','dot'+(r&&r.status?' '+r.status:'')));
        b.appendChild(el('span','cid',c.id));
        b.appendChild(el('span',null,c.title));
        var mk=''; if(isTech(c)) mk+='⚙'; if(r&&r.retest&&(r.status==='fail'||r.status==='na')) mk+='⟳';
        if(mk) b.appendChild(el('span','mk',mk));
        b.addEventListener('click',function(){ view.mode='case'; view.idx=gi; render(); });
        list.appendChild(b);
      });
      wrap.appendChild(list);
      if(view.retestOnly || (view.mode==='case'&&allCases[view.idx]&&allCases[view.idx].sec.id===sec.id)) wrap.classList.add('open');
      nav.appendChild(wrap);
    });
  }

  /* ---------------- views ---------------- */
  var content=document.getElementById('content');

  function profileComplete(){ return state.tester.trim() && emailValid(state.testerEmail) && (state.isTechnical===true||state.isTechnical===false); }

  function renderIntro(){
    var wrap=el('div','intro');
    wrap.appendChild(el('div','crumb','Before you start'));

    if(!profileComplete()){
      var pc=el('div','panel accent');
      pc.appendChild(el('h2',null,'Before you begin'));
      var pp=el('p',null,'Tell us who you are. Your email is used to make fresh test addresses and to send you back the results later. Nothing is uploaded — it stays in this browser.');
      pp.style.color='var(--ink-soft)'; pc.appendChild(pp);
      profileContent2(pc);
      wrap.appendChild(pc);
    }

    var card=el('div','card');
    card.appendChild(el('h2',null,'How this works'));
    ['You will walk through '+allCases.length+' test cases, one at a time. Do exactly what each step says, then press Pass if the app behaved as the Expected result describes, Fail if it did not, or N/A if you could not run the case (say why in the note).',
     'Everything you type is saved automatically in THIS browser. Use "Export" often: it downloads a backup you can re-import with "Import" on any machine.',
     'The Environment selector controls the URLs shown in the steps. Default is the live site.',
     'There is one "Additional observations" box, shared across the whole run and always visible under each case, for anything you notice — about the product OR about this testing tool itself.'
    ].forEach(function(t){ card.appendChild(el('p',null,t)); });
    if(DATA.intro&&DATA.intro.length){
      card.appendChild(el('div','lbl','Notes for this suite'));
      var ul=el('ul'); DATA.intro.forEach(function(t){ var li=el('li'); rich(li,t); ul.appendChild(li); }); card.appendChild(ul);
    }
    wrap.appendChild(card);

    if(DATA.access){ var ac=el('div','panel'); credsContent(ac); wrap.appendChild(ac); }

    var start=el('div','wiznav');
    var b=el('button','next','Start testing →');
    b.addEventListener('click',function(){ if(!profileComplete()){ toast('Please fill your name, a valid email, and the technical question.'); return; } view.mode='case'; view.idx=0; render(); });
    start.appendChild(b);
    wrap.appendChild(start);
    content.appendChild(wrap);
  }
  function profileContent2(host){
    var f1=el('div','field'); f1.appendChild(el('label',null,'Your name')); var i1=el('input'); i1.type='text'; i1.value=state.tester; i1.placeholder='e.g. Adrian'; i1.addEventListener('input',function(){state.tester=i1.value;persist();}); f1.appendChild(i1); host.appendChild(f1);
    var f2=el('div','field'); f2.appendChild(el('label',null,'Email to return results to (your real inbox)')); var i2=el('input'); i2.type='email'; i2.value=state.testerEmail; i2.placeholder='e.g. abarres@raptns.com'; i2.addEventListener('input',function(){state.testerEmail=i2.value;persist();updateProfileNav();}); f2.appendChild(i2); host.appendChild(f2);
    var f3=el('div','field'); f3.appendChild(el('label',null,'Are you comfortable using browser developer tools (F12)?'));
    [['Yes',true],['No',false]].forEach(function(pair){ var lab=el('label','radio'); var r=el('input'); r.type='radio'; r.name='techp'; r.checked=state.isTechnical===pair[1]; r.addEventListener('change',function(){state.isTechnical=pair[1];persist();render();}); lab.appendChild(r); lab.appendChild(document.createTextNode(pair[0])); f3.appendChild(lab); });
    host.appendChild(f3);
  }
  function updateProfileNav(){}

  function renderCase(){
    var x=allCases[view.idx], sec=x.sec, c=x.c, r=res(c.id);

    /* backup reminder (non-blocking): every BACKUP_EVERY advances, unless dismissed */
    if(!state.backupReminderOff && state.stepsSinceExport>0 && state.stepsSinceExport % BACKUP_EVERY===0){
      var rem=el('div','backup-reminder');
      rem.appendChild(el('span','bm-txt','Backup reminder: '+state.stepsSinceExport+' steps since your last export. Export a copy so nothing you typed can get lost.'));
      var rrow=el('div','bm-row');
      var xb=el('button','minibtn','⬇ Export now'); xb.addEventListener('click',function(){ document.getElementById('btn-export').click(); }); rrow.appendChild(xb);
      var lab=el('label','bm-off'); var cbx=el('input'); cbx.type='checkbox'; cbx.addEventListener('change',function(){ state.backupReminderOff=cbx.checked; persist(); render(); }); lab.appendChild(cbx); lab.appendChild(document.createTextNode(' Don’t remind me again')); rrow.appendChild(lab);
      rem.appendChild(rrow);
      content.appendChild(rem);
    }

    content.appendChild(el('div','crumb','Section: '+sec.title+' · Case '+(view.idx+1)+' of '+allCases.length));
    var card=el('div','card');
    var top=el('div','case-top');
    top.appendChild(el('span','case-id',c.id));
    top.appendChild(el('span','tag '+c.kind,c.kind));
    if(c.role) top.appendChild(el('span','tag role','Role: '+c.role));
    if(isTech(c)) top.appendChild(el('span','tag tech','Technical'));
    card.appendChild(top);
    card.appendChild(el('h2',null,c.title));

    /* developer resolution (TA-13) */
    if(r.resolution){
      var rk=r.resolution.status||'fixed';
      var rb=el('div','reso'+(rk==='wontfix'?' wontfix':rk==='needinfo'?' needinfo':''));
      var line=el('div'); var pill=el('span','rpill '+rk, rk==='wontfix'?'Won\'t fix':rk==='needinfo'?'Need info':'Fixed'); line.appendChild(pill); line.appendChild(el('b',null,'Developer resolution')); rb.appendChild(line);
      var rt=el('p'); rt.style.margin='6px 0'; rich(rt,r.resolution.text); rb.appendChild(rt);
      if(r.retest&&(r.status==='fail'||r.status==='na')){
        var reb=el('button','minibtn','Re-test this case');
        reb.addEventListener('click',function(){
          if(r.note){ state.observations=(state.observations?state.observations+'\n':'')+'['+fmtTs(nowISO())+'] ('+c.id+') Previous result: '+(r.status||'').toUpperCase()+' — '+r.note; }
          r.status=null; r.retest=false; persist(); render();
        });
        rb.appendChild(reb);
      }
      card.appendChild(rb);
    }

    /* technical skip banner (TA-2) */
    if(isTech(c) && state.isTechnical===false){
      var tb=el('div','tech-banner');
      tb.appendChild(el('p',null,'This case needs browser developer tools. You marked yourself as non-technical, so you can skip it.'));
      var row=el('div','row');
      var skip=el('button','minibtn','Mark N/A (skip)'); skip.addEventListener('click',function(){ r.status='na'; if(!r.note) r.note='Skipped: technical case, tester is non-technical.'; persist(); goNext(); });
      var showa=el('button','minibtn','Show me anyway'); showa.addEventListener('click',function(){ tb.style.display='none'; });
      row.appendChild(skip); row.appendChild(showa); tb.appendChild(row);
      card.appendChild(tb);
    }

    /* open-in-window button (TA-9) */
    if(c.openInWindow){ var url=linkFor(c.openInWindow); if(url){ var ow=el('button','openwin','Open '+c.openInWindow+' in a new window ↗'); ow.addEventListener('click',function(){openWindow(url);}); card.appendChild(ow); } }

    card.appendChild(el('div','lbl','Do this'));
    var ol=el('ol','steps'); c.steps.forEach(function(s){ var li=el('li'); rich(li,s); ol.appendChild(li); }); card.appendChild(ol);

    /* test data chips (TA-5) */
    if(Array.isArray(c.needs)&&c.needs.length){
      var db=el('div','datablock'); db.appendChild(el('div','lbl','Test data for this case (tap to copy)'));
      var row2=el('div','chiprow'); var d=td(c.id);
      if(c.needs.indexOf('associate')>=0){
        if(!d.associate) d.associate=genAssociate(state.tester);
        row2.appendChild(copyChip('Associate #',d.associate,function(){ d.associate=genAssociate(state.tester); persist(); render(); }));
      }
      var showEmailHint=false;
      if(c.needs.indexOf('email')>=0){
        if(!d.email){ d.email=genEmail(state.testerEmail); }
        if(d.email){ row2.appendChild(copyChip('Customer email',d.email,function(){ d.email=genEmail(state.testerEmail); persist(); render(); })); showEmailHint=true; }
        else { var warn=el('span','datahint'); warn.textContent='Set a valid return email in your Profile to generate test emails.'; row2.appendChild(warn); }
      }
      db.appendChild(row2);
      if(showEmailHint){
        var hint=el('div','datahint');
        hint.appendChild(document.createTextNode('The part after “+” is just a label. This email still arrives in your normal inbox ('));
        hint.appendChild(el('b',null,emailBase()));
        hint.appendChild(document.createTextNode('); it just gives each test a fresh-looking address without creating a new mailbox.'));
        db.appendChild(hint);
      }
      persist(); card.appendChild(db);
    }

    card.appendChild(el('div','lbl','Expected result'));
    var ex=el('div','expected'); rich(ex,c.expected); card.appendChild(ex);
    if(c.why){ var wy=el('div','why'); wy.appendChild(el('b',null,'Why this matters: ')); rich(wy,c.why); wy.querySelector('b').style.fontStyle='normal'; card.appendChild(wy); }

    /* verdict */
    card.appendChild(el('div','lbl','Your verdict'));
    var vd=el('div','verdict');
    [['pass','✔ Pass'],['fail','✘ Fail'],['na','— N/A']].forEach(function(pair){
      var b=el('button','vbtn '+pair[0]+(r.status===pair[0]?' on':''),pair[1]);
      b.addEventListener('click',function(){ r.status=(r.status===pair[0])?null:pair[0]; persist(); render(); });
      vd.appendChild(b);
    });
    card.appendChild(vd);

    card.appendChild(el('div','lbl','Note (what you saw, error text, etc.) — you can paste a screenshot here'));
    var ta=el('textarea'); ta.value=r.note; ta.placeholder='Optional for Pass, please fill for Fail / N/A. Paste an image to attach it.';
    ta.addEventListener('input',function(){ r.note=ta.value; persist(); });
    ta.addEventListener('paste',function(ev){ var items=(ev.clipboardData||{}).items||[]; for(var i=0;i<items.length;i++){ if(items[i].type&&items[i].type.indexOf('image/')===0){ var f=items[i].getAsFile(); if(f){ ev.preventDefault(); addShot(c.id,f); } } } });
    card.appendChild(ta);

    /* screenshots (TA-8) */
    var arow=el('div','attachrow');
    var fl=el('input'); fl.type='file'; fl.accept='image/*'; fl.style.display='none'; fl.addEventListener('change',function(){ if(fl.files[0]) addShot(c.id,fl.files[0]); fl.value=''; });
    var ab=el('button','minibtn','📎 Attach screenshot'); ab.addEventListener('click',function(){ fl.click(); });
    arow.appendChild(ab); arow.appendChild(fl); arow.appendChild(el('span','hint','…or paste an image into the note above.'));
    card.appendChild(arow);
    if(r.shots&&r.shots.length){
      var sh=el('div','shots');
      r.shots.forEach(function(s){ var d=el('div','shot'); var im=el('img'); im.src=s.dataUrl; im.addEventListener('click',function(){ openModal(function(host){ host.appendChild(el('h3',null,s.name||'Screenshot')); var big=el('div','imgmodal'); var i2=el('img'); i2.src=s.dataUrl; big.appendChild(i2); host.appendChild(big); }); }); d.appendChild(im); var rm=el('button',null,'×'); rm.addEventListener('click',function(){ if(confirm('Remove this screenshot?')){ r.shots=r.shots.filter(function(z){return z.id!==s.id;}); persist(); render(); } }); d.appendChild(rm); sh.appendChild(d); });
      card.appendChild(sh);
    }

    /* evidence (TA-1, hidden by default) */
    if(c.source && state.showEvidence){ var src=el('div','source'); src.appendChild(el('b',null,'Evidence (developers): ')); src.appendChild(document.createTextNode(c.source)); card.appendChild(src); }

    content.appendChild(card);

    var wn=el('div','wiznav');
    var prev=el('button',null,'← Back');
    prev.addEventListener('click',function(){ if(view.idx>0){view.idx--;render();} else {view.mode='intro';render();} });
    wn.appendChild(prev);
    var saveMsg='Progress is saved automatically in this browser.';
    if(state.stepsSinceExport>0) saveMsg+=' '+state.stepsSinceExport+' step'+(state.stepsSinceExport===1?'':'s')+' since your last export.';
    wn.appendChild(el('span','savehint',saveMsg));
    var next=el('button','next', view.idx<allCases.length-1?'Next case →':'Finish → Summary');
    next.addEventListener('click',goNext);
    wn.appendChild(next);
    content.appendChild(wn);

    /* additional observations — one shared box, always visible, kept across the whole run */
    var ob=el('div','obsbox');
    ob.appendChild(el('div','lbl','Additional observations'));
    var oh=el('p'); oh.style.cssText='font-size:12px;color:var(--ink-soft);margin-bottom:8px';
    oh.textContent='See a problem with this task? Your Pass / Fail / N/A above already covers it. This shared notepad is for anything else you notice as you go — about the product OR about this testing tool itself (for example, if it fails to save something). Write freely; it saves automatically and stays here on every step.';
    ob.appendChild(oh);
    var ota=el('textarea','obsta'); ota.value=state.observations||''; ota.rows=6; ota.placeholder='Type anything you notice here. It is kept for the whole run.';
    ota.addEventListener('input',function(){ state.observations=ota.value; persist(); });
    ob.appendChild(ota);
    content.appendChild(ob);
  }
  function goNext(){
    state.stepsSinceExport=(state.stepsSinceExport||0)+1;
    if(view.idx<allCases.length-1){view.idx++;} else {view.mode='summary';}
    persist(); render();
  }

  function renderSummary(){
    var c=counts();
    content.appendChild(el('div','crumb','Summary'));
    var tiles=el('div','sum-tiles');
    [['Total',c.total],['Done',c.done],['Pass',c.pass],['Fail',c.fail],['N/A',c.na],['Pending',c.total-c.done],['Needs retest',c.retest]].forEach(function(t){ var d=el('div','tile'); d.appendChild(el('b',null,String(t[1]))); d.appendChild(el('span',null,t[0])); tiles.appendChild(d); });
    content.appendChild(tiles);

    if(c.retest){
      var rf=el('div','wiznav'); rf.style.marginTop='0';
      var rb=el('button',state.showRetestBtn?'next':'', (view.retestOnly?'Show all cases':'Filter: Needs retest only'));
      rb.addEventListener('click',function(){ view.retestOnly=!view.retestOnly; if(view.retestOnly){ var first=allCases.find(function(x){var r=state.results[x.c.id];return r&&r.retest&&(r.status==='fail'||r.status==='na');}); if(first){ view.mode='case'; view.idx=allCases.indexOf(first); } } render(); });
      rf.appendChild(rb); content.appendChild(rf);
    }

    var tbl=el('table','sum'); var thead=el('thead'); var trh=el('tr'); ['Case','Title','Status','Note'].forEach(function(h){trh.appendChild(el('th',null,h));}); thead.appendChild(trh); tbl.appendChild(thead);
    var tb=el('tbody');
    DATA.sections.forEach(function(sec){
      var trs=el('tr'); var tds=el('td',null,''); tds.colSpan=4; tds.style.cssText='background:#f8f5ee;font-weight:700'; tds.textContent=sec.title; trs.appendChild(tds); tb.appendChild(trs);
      sec.cases.forEach(function(cse){
        var r=state.results[cse.id], st=r&&r.status?r.status:'pending';
        var tr=el('tr'); var tdid=el('td'); tdid.appendChild(el('code',null,cse.id)); if(r&&r.retest)tdid.appendChild(document.createTextNode(' ⟳')); tr.appendChild(tdid);
        tr.appendChild(el('td',null,cse.title));
        tr.appendChild(el('td','st-'+st, st==='pending'?'—':st.toUpperCase()));
        var tdn=el('td',null,(r&&r.note)||''); if(r&&r.shots&&r.shots.length) tdn.appendChild(el('span',null,' 📎'+r.shots.length)); tr.appendChild(tdn);
        tb.appendChild(tr);
      });
    });
    tbl.appendChild(tb); content.appendChild(tbl);

    if(state.observations && state.observations.trim()){
      content.appendChild(el('div','lbl','Additional observations from the tester'));
      var obx=el('div','obsbox'); var obp=el('div'); obp.style.whiteSpace='pre-wrap'; obp.textContent=state.observations; obx.appendChild(obp); content.appendChild(obx);
    }

    var wn=el('div','wiznav');
    var back=el('button',null,'← Back to cases'); back.addEventListener('click',function(){ view.mode='case'; render(); }); wn.appendChild(back);
    var pr=el('button',null,'Print / Save as PDF'); pr.addEventListener('click',function(){ window.print(); }); wn.appendChild(pr);
    content.appendChild(wn);
  }

  function render(){
    content.textContent='';
    buildNav(); syncEnvUI(); updateProgress();
    if(view.mode==='intro') renderIntro();
    else if(view.mode==='summary') renderSummary();
    else renderCase();
    content.scrollTop=0;
  }
  render();
})();
</script>
</body>
</html>
